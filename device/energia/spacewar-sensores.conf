# /etc/tmpfiles.d/spacewar-sensores.conf — spacewar (2026-09-20)
#
# Crea el interruptor que impide que el gancho 50-despertar-y-sensores PARE
# iio-sensor-proxy mientras el móvil duerme.
#
# POR QUÉ: al parar el servicio, phosh pierde el acelerómetro para TODA la sesión
# y deja de ofrecer la rotación automática (solo queda el selector manual de
# orientación). No se recupera cuando el servicio vuelve: hay que reiniciar phosh.
# Medido el 2026-09-20: con el servicio estable, `AccelerometerOrientation` pasa de
# "undefined" a "normal"; tras un ciclo stop/start vuelve a "undefined" para siempre.
#
# COSTE: los sensores siguen activos al dormir. Medido el 14-09: ~6 mA (al borde del
# ruido); el riesgo real no son los mA sino que su flujo QRTR con el ADSP (un mensaje
# cada ~60 ms) despierte al SoC antes de tiempo.
#
# ⏳ PROVISIONAL: falta comprobar si phosh SUELTA el acelerómetro con la pantalla
# apagada. Si lo suelta, el flujo cesa solo y esto sobra.
# Quitar con: rm /etc/tmpfiles.d/spacewar-sensores.conf
f /run/despertar-sin-parar-sensores 0644 root root -
