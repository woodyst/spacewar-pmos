# /etc/systemd/sleep.conf.d/sleep-solo-deep.conf — spacewar (2026-09-15)
#
# POR QUÉ: si la suspensión profunda («deep», mem) devuelve error, systemd-sleep prueba el siguiente estado de la lista
# (por omisión «mem standby freeze») y cae a s2idle («freeze»). En spacewar s2idle CUELGA el móvil: el 2026-09-15 a las
# 14:38:47 una suspensión deep abortó al volver (un flujo continuo del ADSP, ~3300 interrupciones glink por ciclo), systemd
# entró en «PM: suspend entry (s2idle)» en el mismo milisegundo y el móvil no volvió (console-ramoops acaba ahí; arranque
# nuevo 14:42:53).
# Con solo «mem», un aborto de la suspensión deja la suspensión fallida y el móvil despierto; volver-a-dormir o gsd-power
# lo reintentan más tarde, en vez de colgarlo. Lo instala scripts/99-ganchos-suspension.sh.
[Sleep]
SuspendState=mem
MemorySleepMode=deep
