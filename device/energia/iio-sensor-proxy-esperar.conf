# /etc/systemd/system/iio-sensor-proxy.service.d/esperar.conf — spacewar (2026-09-28)
#
# Que iio-sensor-proxy no arranque hasta que el concentrador de sensores del ADSP conteste: busca los sensores UNA
# vez y, si llega antes (a los ~8 s del arranque, con el concentrador aún cargando ~86 s), se queda sin
# acelerómetro toda la sesión y phosh no ofrece la rotación automática.
[Unit]
Wants=hexagonrpcd-adsp-sensorspd.service
After=hexagonrpcd-adsp-sensorspd.service

[Service]
ExecStartPre=/usr/local/sbin/esperar-sensores-adsp.sh
# el ExecStartPre espera hasta 150 s: el arranque del servicio tiene que poder durar más que eso
TimeoutStartSec=240
