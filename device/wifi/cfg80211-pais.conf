# /etc/modprobe.d/cfg80211-pais.conf — spacewar (2026-09-14)
#
# País de la Wi-Fi: España. Sin esto cfg80211 arranca con el dominio global «00»: 5 GHz solo con escaneo pasivo y
# los canales DFS sin fijar. cfg80211 es módulo (CONFIG_CFG80211=m) y lee la base firmada de wireless-regdb
# (/lib/firmware/regulatory.db). Lo instala scripts/95-wifi.sh.
options cfg80211 ieee80211_regdom=ES
