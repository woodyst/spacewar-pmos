# /etc/systemd/system/hexagonrpcd-adsp-rootpd.service.d/override-fwdir.conf (spacewar, 2026-09-12)
#
# El dominio raíz del ADSP sirve las bibliotecas del DSP (dsp/adsp/*.so) desde su directorio -R. La unidad
# del paquete no lo pasa y hexagonrpcd sirve «./» (vacío: «Could not open .//lowi//lowi_lp.conf»). Como en
# surya (scripts/40-sensores.sh), apuntarlo al firmware del teléfono.
[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -R /usr/share/qcom/sm7325/Nothing/spacewar
