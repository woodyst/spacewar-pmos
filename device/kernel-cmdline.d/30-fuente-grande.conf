# Letra grande en la consola del arranque (Terminus 16x32), como en surya.
#
# NO se pone en /boot/loader/entries/pmos.conf ni a mano en el boot.img: boot-deploy los REGENERA en
# cada mkinitfs a partir de los ficheros de kernel-cmdline.d, y una edición a mano se pierde a la
# siguiente instalación de un paquete que dispare el gancho.
#
# Requiere que la fuente esté COMPILADA en el kernel: CONFIG_FONTS=y y CONFIG_FONT_TER16x32=y
# (kernel r102 en adelante). Sin eso el parámetro se ignora en silencio.
fbcon=font:TER16x32
