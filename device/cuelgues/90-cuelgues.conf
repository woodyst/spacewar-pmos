# /etc/sysctl.d/90-cuelgues.conf — spacewar: que un cuelgue deje rastro (2026-09-13)
#
# El 2026-09-13 spacewar se congeló (descargando mapas con OSM Scout Server mientras se instalaba un
# kernel: escritura fuerte) y no quedó nada: ni detectores, ni ramoops, ni perro guardián. Esto va con el
# kernel r118 (PSTORE_RAM/CONSOLE/PMSG, SOFTLOCKUP/HARDLOCKUP(buddy)/HUNG_TASK, GUNYAH_WATCHDOG) y con
# perro-vivo. Tras un reinicio, el rastro aparece en /var/lib/systemd/pstore/ (lo archiva systemd-pstore).
#
# Mismos criterios que surya (suria/parches/cuelgues/config/90-cuelgues.conf):

# Todo a la consola, que es lo que graba ramoops. Con el nivel de serie las PILAS de las tareas colgadas
# (nivel info) no llegan a la consola y el volcado se queda en la cabecera. Se pone aquí y no en la línea
# de arranque (nada de depuración en la línea de arranque).
kernel.printk = 7 4 1 7

# Una CPU girando sin ceder (bloqueo blando) o con las interrupciones cortadas (bloqueo duro, variante
# buddy: este SoC no tiene NMI): pánico con volcado y reinicio. Sin esto el móvil se queda frito sin rastro.
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.softlockup_all_cpu_backtrace = 1
kernel.hardlockup_all_cpu_backtrace = 1

# Tareas bloqueadas (estado D) más de 120 s: se anota la pila, SIN pánico. En surya el pánico por tarea
# colgada convertía un fallo del módem (IPA) en un bucle de reinicios cada dos minutos. El congelado del
# almacenamiento lo corta perro-vivo con su prueba de disco, y la pila ya habrá quedado en ramoops.
kernel.hung_task_panic = 0
kernel.hung_task_timeout_secs = 120
kernel.hung_task_warnings = -1

# Un oops deja el kernel en estado dudoso: mejor pánico con volcado.
kernel.panic_on_oops = 1
# Reiniciar 10 s después del pánico (daba 120).
kernel.panic = 10

# SysRq solo para volcar: 'l' pilas de todas las CPU, 'w' tareas bloqueadas, 't' todas las tareas
# (echo w > /proc/sysrq-trigger). 0x1 los permite todos; se limita a lo informativo + sync + reinicio:
#   2 consola · 16 sync · 64 reinicio · 128 volcados de estado → 210
kernel.sysrq = 210
