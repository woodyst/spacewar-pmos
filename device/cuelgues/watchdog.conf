# /etc/systemd/system.conf.d/watchdog.conf — spacewar (2026-09-13), como surya
#
# El perro lo coge perro-vivo, que solo acaricia si el móvil supera una prueba de vida real (proceso, fichero
# y disco con fsync). systemd no debe abrirlo nunca: si lo abre, perro-vivo no puede, y cuando systemd lo
# suelta sin el cierre mágico el hardware muerde a los pocos segundos (surya, 2026-08-23). Por eso el
# traspaso se hace en el arranque: habilitar perro-vivo y REINICIAR, nunca en caliente.
[Manager]
RuntimeWatchdogSec=0
RebootWatchdogSec=15
