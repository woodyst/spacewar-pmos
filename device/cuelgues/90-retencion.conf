# /etc/systemd/journald.conf.d/90-retencion.conf — spacewar (2026-09-13), como surya
#
# Los cuelgues se investigan mirando hacia atrás: garantizar mucho más de 24 h de diario y que se escriba a
# disco a menudo (el congelado del 2026-09-13 dejó el diario hasta el último segundo, pero con el de serie
# un apunte puede quedarse minutos en memoria).
[Journal]
Storage=persistent
SystemMaxUse=2G
SystemKeepFree=1G
MaxFileSec=1day
MaxRetentionSec=0
SyncIntervalSec=30s
