# /var/lib/greetd/.config/wireplumber/wireplumber.conf.d/10-greeter-sin-bluetooth.conf — spacewar (2026-09-21)
#
# El wireplumber de la PANTALLA DE ENTRADA (usuario greetd) no toca el Bluetooth.
#
# Por qué: arranca antes que la sesión del usuario y registra el perfil de voz (HFP) en bluetoothd, que es
# EXCLUSIVO. Cuando el usuario entra, la sesión greetd tarda en cerrarse (21-09: se abrió 13:05:52, su
# wireplumber registró el HFP a las 13:05:57 y su gestor no terminó hasta las 13:06:18), y el wireplumber del
# usuario, a las 13:06:10, se encuentra el HFP cogido: «RegisterProfile() failed: NotPermitted». El casco
# conecta solo con A2DP y la primera llamada va al auricular con «casco sin HFP». hfp-registrado.sh lo repara
# reiniciando wireplumber, pero después. En la pantalla de entrada el Bluetooth no sirve para nada.
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
  }
}
