# /etc/modprobe.d/hci_uart-offload.conf — spacewar (2026-09-13), como surya
#
# El SCO de las llamadas por casco va por SLIMbus (SLIMBUS_7) al DSP, no por HCI. hfp_offload=1 hace que
# hci_qca declare el camino de datos no-HCI (kernel 0011 + 0020 para el WCN6750): sin él el núcleo abre el SCO
# por HCI y el chip no usa su lado SLIMbus. (Verificado 2026-09-13: el eSCO sale con Data Path Vendor Specific.
# NO es lo que hace enumerar al chip: con el SCO descargado en pie el WCN6750 sigue sin aparecer en el bus.)
options hci_uart hfp_offload=1
