# Use case configuration for Nothing Phone (1)
#
# spacewar (2026-09-12): parte del HiFi.conf del paquete alsa-ucm-conf-qcom-sc7280, con lo medido en el móvil:
#
# 1. Rutas de CS-Voice SIEMPRE encendidas (aquí y en VoiceCall.conf, nunca en un DisableSequence). q6voiced
#    abre el PCM CS-Voice en el instante en que la llamada pasa a activa, antes de que PipeWire cambie al
#    perfil «Voice Call»: sin la ruta de captura el kernel da EINVAL («no backend DAIs enabled», que solo se
#    registra una vez por arranque) y la llamada va muda. Como en surya (PENDIENTES.md, 2026-07-18). Una ruta a
#    un PCM de voz parado no lleva audio.
#
# 2. Puertos SoundWire de los micros siempre encendidos (ADC1 Switch y ADC2 Switch, los dos en el puerto 1 del
#    códec) y fuera de todo DisableSequence. `ADCn Switch` no enciende hardware: marca el canal del puerto
#    (wcd938x_set_swr_port) y el driver lo lee UNA vez, en el hw_params de la captura. Si q6voiced abre la voz
#    con un micro y la llamada usa otro de otro canal, ese micro no entra en el flujo. Surya 2026-08-22
#    (LLAMADAS-MUDAS-SOUNDWIRE.md).
#
# 3. Los micros por el decimador 0 (DEC0), como Fairphone 5 (mismo SoC y WCD9385). Con DEC1, que traía el
#    paquete, la captura por TX_CODEC_DMA_TX_3 arranca sin un error en ninguna capa pero no entrega datos
#    (`arecord`: «read error: I/O error»), y la llamada iba sin subida. Cada ADC con su modo: TX0 MODE = ADC1,
#    TX1 MODE = ADC2.
#
# 4. Qué micro es cuál, medido con un tono por un solo amplificador (Earpiece/Speaker Output Switch, r106):
#      AMIC1 (ADC1, SWR_MIC0)        = ABAJO   (tono solo abajo 2904, solo arriba 386)
#      AMIC3 (ADC2 INP3, SWR_MIC1)   = ARRIBA  (tono solo abajo 196,  solo arriba 655)
#    El paquete llamaba «Top» al de ADC1 y ponía el de abajo en ADC3 INP4 / el trasero en ADC4 INP5: por ahí
#    no llega sonido. Los micros digitales que usa el Android de fábrica (dmic1/dmic4, SWRM_TX3) no dan audio
#    con el driver mainline: pendiente.
#    Micro de cascos (Mic2): ADC2 INP2, comparte ADC2 con el de arriba.
#
# 5. PlaybackMixer "hw:${CardId}", no "default:${CardId}" (el del paquete): «default» solo existía por el ctl.default
#    que guardaba lib/ctl-remap.conf, quitado de NP1.conf. Sin un mezclador válido PipeWire no tiene volumen ni
#    silencio por hardware en ningún dispositivo («Failed to find a working mixer device (_ucm0001.default:NP1)»)
#    y el silencio del micro en llamada (CaptureSwitch) no llegaba al DSP.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='PRI_MI2S_RX Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Switch' 1"
		# fuera lo que no lleva sonido y estorba: DEC1 (la captura no entrega nada) y ADC3/ADC4 (puerto 2)
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC4 Switch' 0"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker & Earpiece Playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "hw:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "hw:${CardId}"
		PlaybackMixerElem "HP Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic1" {
	Comment "Bottom Microphone"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"

		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Mic2" {
	Comment "Headphone Microphone"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF2_CAP Mixer DEC0' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 84"

		cset "name='ADC2_MIXER Switch' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
		cset "name='TX1 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF2_CAP Mixer DEC0' 0"
		# ADC2 Switch se queda encendido: es el puerto del micro de arriba (ver cabecera, punto 2)
		cset "name='ADC2 MUX' INP3"
	]

	Value {
		CapturePriority 150
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		#JackControl "Mic Jack"
	}
}

SectionDevice."Mic4" {
	Comment "Top Microphone"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 84"

		cset "name='ADC2_MIXER Switch' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2 Switch' 1"
		cset "name='TX1 MODE' ADC_NORMAL"
	]

	DisableSequence [
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CaptureChannels 1
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
	}
}
