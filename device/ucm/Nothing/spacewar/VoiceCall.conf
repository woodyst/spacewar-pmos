# Llamadas (CS voice) del Nothing Phone (1) — spacewar, 2026-09-12.
#
# Adaptado del VoiceCall.conf de surya. La voz no pasa por la CPU: q6voiced abre el PCM «CS-Voice» al
# empezar la llamada y el DSP une el vocoder del módem con los puertos AFE que eligen estas rutas:
#   bajada  PRI_MI2S_RX Voice Mixer CS-Voice   -> los dos TFA9873 (I2S primario)
#           SLIMBUS_7_RX Voice Mixer CS-Voice  -> Bluetooth (en Android de fábrica el SCO va por SLIMBUS_7)
#   subida  CS-Voice Capture Mixer TX_CODEC_DMA_TX_3 <- micrófono del WCD9385
#           CS-Voice Capture Mixer SLIMBUS_7_TX       <- Bluetooth
#
# Lo que manda en este fichero se explica en la cabecera de HiFi.conf (medido en el móvil):
#   - rutas CS-Voice y puertos SoundWire de los micros (ADC1/ADC2 Switch) siempre encendidos: q6voiced abre
#     la voz antes de que PipeWire cambie a este perfil; solo el Bluetooth apaga las rutas internas
#   - micros por DEC0 (por DEC1 la captura no entrega nada)
#   - auricular: micro de ABAJO (AMIC1, ADC1, SWR_MIC0), lejos del auricular
#   - manos libres: micro de ARRIBA (AMIC3, ADC2 INP3, SWR_MIC1): recoge el altavoz de abajo ~23 dB menos
#     que el de abajo (196 frente a 2904 con el mismo tono), menos eco sin cancelación
#
# Como en surya, el verbo lleva un PCM «señuelo» de reproducción y otro de captura: sin sink ni source
# PipeWire no aplica el perfil y las rutas no se ejecutan. No lleva audio de la llamada.
#   señuelo de reproducción: MultiMedia1 (hw:0,0) hacia PRI_MI2S_RX
#   señuelo de captura:      MultiMedia3 (hw:0,2) desde TX_CODEC_DMA_TX_3
#
# Auricular y altavoz: los dos TFA9873 reciben lo mismo; el parche 0014 (kernel r106) les da
#   «Earpiece Output Switch» (el de arriba) y «Speaker Output Switch» (el de abajo) para apagar uno.
#   Al salir de la llamada se vuelven a encender los dos (el perfil HiFi los quiere en estéreo).

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='PRI_MI2S_RX Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='DEC0 MODE' ADC_DEFAULT"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='SLIMBUS_7_RX Voice Mixer CS-Voice' 0"
		cset "name='CS-Voice Capture Mixer SLIMBUS_7_TX' 0"
		cset "name='PRI_MI2S_RX Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='Earpiece Output Switch' 1"
		cset "name='Speaker Output Switch' 1"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
		"Bluetooth"
	]

	EnableSequence [
		cset "name='SLIMBUS_7_RX Voice Mixer CS-Voice' 0"
		cset "name='CS-Voice Capture Mixer SLIMBUS_7_TX' 0"
		cset "name='Earpiece Output Switch' 1"
		cset "name='Speaker Output Switch' 0"
		cset "name='PRI_MI2S_RX Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"

		# Calibración de voz: la de MANOS LIBRES también en el auricular (kernel 0140: cambiarla en llamada rehace
		# el vocproc). La del auricular de fábrica (topologías de Nothing TX 0x1000BFF1 / RX 0x1000BFF2) mete el
		# micro en la salida con mucha ganancia: el usuario se oía a sí mismo, acoplaba, y ni el silencio (subida)
		# ni el volumen ni la cancelación de eco lo tocaban. Medido 2026-09-13 (pruebas/sidetone-medida.sh, tono
		# por el altavoz de abajo junto al micro): ruido entre pulsos 7990 con Handset, 26 con Speaker. Además su
		# tabla de volumen repite los mismos datos en los pasos 0-5; la de manos libres cambia en cada paso.
		cset "name='Voice Calibration' Speaker"

		# micro de abajo
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX SMIC MUX0' SWR_MIC0"
	]

	DisableSequence [
		cset "name='Earpiece Output Switch' 1"
		cset "name='Speaker Output Switch' 1"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		# Volumen de llamada: el paso RX del vocproc en el DSP ('Voice Rx Playback Volume', kernel r114; «Voice Rx»
		# es su elemento simple). Los TFA9873 no tienen ganancia útil (AMPGAIN −4,4 dB en 90 pasos, TDMSPKG
		# nada) y el audio de la llamada no pasa por la CPU: el volumen del sumidero solo actúa si va aquí.
		# Pasos 0-6 (kernel r115): las tablas de volumen de la calibración de fábrica tienen 7 filas por red
		# y frecuencia; con 0-15 (r114) más de la mitad del deslizador pedía pasos que no están en la tabla.
		PlaybackMixerElem "Voice Rx"
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
		CapturePriority 200
		# Silencio del micro en el DSP ('Voice Tx Capture Switch', kernel 0139). PipeWire (ACP) solo arma
		# volumen y silencio por hardware desde CaptureMixerElem/CaptureVolume: con CaptureSwitch a secas el
		# silencio de la fuente se quedaba en software y no tocaba la llamada (2026-09-13). «Voice Tx» es el
		# elemento simple de alsa-lib para 'Voice Tx Capture Switch'.
		CaptureMixerElem "Voice Tx"
		CaptureSwitch "name='Voice Tx Capture Switch'"
	}
}

SectionDevice."Speaker" {
	Comment "Speakerphone"

	ConflictingDevice [
		"Earpiece"
		"Bluetooth"
	]

	EnableSequence [
		cset "name='SLIMBUS_7_RX Voice Mixer CS-Voice' 0"
		cset "name='CS-Voice Capture Mixer SLIMBUS_7_TX' 0"
		cset "name='Earpiece Output Switch' 0"
		cset "name='Speaker Output Switch' 1"
		cset "name='PRI_MI2S_RX Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 1"

		# calibración de manos libres: con la del auricular la cancelación de eco no quitaba nada (medido
		# 2026-09-12 con los móviles en habitaciones distintas: tono devuelto 70 con ella, 53 sin cancelación)
		cset "name='Voice Calibration' Speaker"

		# micro de arriba
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='TX1 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX SMIC MUX0' SWR_MIC1"
	]

	DisableSequence [
		cset "name='Earpiece Output Switch' 1"
		cset "name='Speaker Output Switch' 1"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Voice Rx"
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
		CapturePriority 100
		# Silencio del micro en el DSP ('Voice Tx Capture Switch', kernel 0139). PipeWire (ACP) solo arma
		# volumen y silencio por hardware desde CaptureMixerElem/CaptureVolume: con CaptureSwitch a secas el
		# silencio de la fuente se quedaba en software y no tocaba la llamada (2026-09-13). «Voice Tx» es el
		# elemento simple de alsa-lib para 'Voice Tx Capture Switch'.
		CaptureMixerElem "Voice Tx"
		CaptureSwitch "name='Voice Tx Capture Switch'"
	}
}

SectionDevice."Bluetooth" {
	Comment "Bluetooth headset"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	# Primero se ENCIENDE el Bluetooth y luego se apagan las rutas internas: si la voz se queda un instante sin
	# ruta de captura y q6voiced abre justo entonces, falla con -EIO y la llamada sale muda (lección de surya).
	# Los TFA se callan con sus Output Switch (el audio de la llamada no debe salir también por el móvil).
	EnableSequence [
		cset "name='SLIMBUS_7_RX Voice Mixer CS-Voice' 1"
		cset "name='CS-Voice Capture Mixer SLIMBUS_7_TX' 1"
		cset "name='PRI_MI2S_RX Voice Mixer CS-Voice' 0"
		cset "name='CS-Voice Capture Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='Earpiece Output Switch' 0"
		cset "name='Speaker Output Switch' 0"
	]

	# VACÍA a propósito, como en surya: Earpiece y Speaker ya apagan SLIMBUS_7 y encienden sus rutas al activarse,
	# y el verbo lo deja todo como estaba al salir. Apagar aquí el Bluetooth antes de que el siguiente dispositivo
	# encienda el suyo abría la ventana sin ruta de captura.
	DisableSequence [
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
