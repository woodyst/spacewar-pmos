# Use case configuration for Nothing Phone (1)
#
# spacewar (2026-09-12): el NP1.conf del paquete alsa-ucm-conf-qcom-sc7280 más el caso de uso
# «Voice Call» (VoiceCall.conf). Se instala sobre /usr/share/alsa/ucm2/Nothing/spacewar/ (una
# actualización del paquete lo pisaría: el script de despliegue lo vuelve a poner).

Syntax 4

SectionUseCase."HiFi" {
	File "/Nothing/spacewar/HiFi.conf"
	Comment "HiFi quality Music."
}

SectionUseCase."Voice Call" {
	File "/Nothing/spacewar/VoiceCall.conf"
	Comment "Phone call"
}

BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC1 Volume' 12"
	cset "name='ADC2 Volume' 12"
	cset "name='ADC4 Volume' 12"
	cset "name='ADC4 Volume' 12"
]

Include.card-init.File "/lib/card-init.conf"
# Sin ctl-remap (spacewar, 2026-09-13): lib/ctl-remap.conf guarda al arrancar un «ctl.default» global de tipo
# remap, y con él amixer -c0 («Cannot find the given element from control sysdefault:0») y el mezclador que
# PipeWire abre por el UCM (_ucmNNNN.hw:NP1) dejan de ver los controles: el silencio del micro en llamada
# (CaptureSwitch 'Voice Tx Capture Switch') quedaba en software y no llegaba al DSP. surya no lo incluye.
Include.wcd-init.File "/codecs/wcd938x/init.conf"
