# /etc/systemd/system/q6voiced.service.d/cs-voice.conf — spacewar (2026-11-22)
# La unidad de q6voiced lee /usr/share/q6voiced/q6voiced.conf, que trae un número de PCM escrito a mano y que
# envejece (al actualizar el kernel pasó de hw:0,3 a hw:0,6). Aquí se le manda leer el que genera
# q6voiced-device.service detectando el PCM «CS-Voice» por su nombre en cada arranque.
# Lo instala scripts/60-llamadas.sh.
[Service]
EnvironmentFile=
EnvironmentFile=/run/q6voiced/q6voiced.conf
