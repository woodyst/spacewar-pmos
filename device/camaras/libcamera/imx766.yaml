# /etc/libcamera/ipa/simple/imx766.yaml — cámara principal IMX766 de spacewar (2026-09-14)
#
# Sin este fichero libcamera usa uncalibrated.yaml, cuyo BlackLevel sin valor estima el negro con la imagen: en una
# escena oscura lo pone demasiado alto, deja la señal casi a cero y el revelado sale con manchas de color. El bruto
# del sensor está bien (RGGB comprobado con pruebas/camaras/raw-bayer.sh, sin rejilla de píxeles raros); su negro
# es 64 en 10 bits = 4096 en la escala de 16 bits que usa libcamera.
# Sin matriz de color (Ccm) hasta calibrarla: la de otro sensor estropea más de lo que arregla.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Adjust:
  - Agc:
  # autoenfoque por contraste (libcamera propio, packages/libcamera 0010); sin lente descrita no hace nada
  - Af:
...
